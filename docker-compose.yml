services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: vehicle
      POSTGRES_PASSWORD: vehicle
      POSTGRES_DB: vehicle
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: vehicle
      DB_USER: vehicle
      DB_PASSWORD: vehicle
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy